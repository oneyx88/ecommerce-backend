server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - TokenRelay

      routes:

        # 1️⃣ user-service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
          filters:
            - name: RewritePath
              args:
                regexp: "^/users(?<segment>/.+)?"
                replacement: "/api/v1/users${segment}"
            - name: CircuitBreaker
              args:
                name: userCircuit
                fallbackUri: forward:/fallback/users
            # GET 是可重试的，POST(注册/登录) 禁止重试
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR

        # 2️⃣ order-service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
          filters:
            - name: RewritePath
              args:
                regexp: "^/orders(?<segment>/.+)?"
                replacement: "/api/v1/orders${segment}"
            - name: CircuitBreaker
              args:
                name: orderCircuit
                fallbackUri: forward:/fallback/orders
            # 注意：订单创建 POST 不能 retry，会重复创建订单！
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR

        # 3️⃣ product-service
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**, /categories/**
          filters:
            - name: RewritePath
              args:
                regexp: "^/(?<resource>products|categories)(?<segment>/.+)?"
                replacement: "/api/v1/${resource}${segment}"
            - name: CircuitBreaker
              args:
                name: productCircuit
                fallbackUri: forward:/fallback/products
            # 商品查询大量 GET，非常适合 retry，提高稳定性
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT

        # 静态图片不需要 retry
        - id: product-images
          uri: lb://product-service
          predicates:
            - Path=/images/**

        # 4️⃣ inventory-service
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventories/**
          filters:
            - name: RewritePath
              args:
                regexp: "^/inventories(?<segment>/.+)?"
                replacement: "/api/v1/inventories${segment}"
            - name: CircuitBreaker
              args:
                name: inventoryCircuit
                fallbackUri: forward:/fallback/inventories
            # 库存查询(GET)可以 retry，扣减库存(POST)不能 retry
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT

        # 5️⃣ payment-service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - name: RewritePath
              args:
                regexp: "^/payments(?<segment>/.+)?"
                replacement: "/api/v1/payments${segment}"
            - name: CircuitBreaker
              args:
                name: paymentCircuit
                fallbackUri: forward:/fallback/payments
          # ⚠ 支付不能 retry，否则会重复扣款
          # 因此完全不配置 Retry

        # 6️⃣ cart-service
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/carts/**
          filters:
            - name: RewritePath
              args:
                regexp: "^/carts(?<segment>/.+)?"
                replacement: "/api/v1/carts${segment}"
            - name: CircuitBreaker
              args:
                name: cartCircuit
                fallbackUri: forward:/fallback/carts
            # 购物车 GET 可重试，POST/PUT 禁止重试，否则会重复加/减商品
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT

        # 7️⃣ address-service
        - id: address-service
          uri: lb://address-service
          predicates:
            - Path=/addresses/**
          filters:
            - name: RewritePath
              args:
                regexp: "^/addresses(?<segment>/.+)?"
                replacement: "/api/v1/addresses${segment}"
            - name: CircuitBreaker
              args:
                name: addressCircuit
                fallbackUri: forward:/fallback/addresses
            # GET 可重试，新增地址 POST 禁止
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

  data:
    redis:
      host: ecommerce-redis-hpzzdp.serverless.use1.cache.amazonaws.com
      port: 6379
      ssl:
        enabled: true

  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTH_URL}
            token-uri: ${KEYCLOAK_TOKEN_URI}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://keycloak:8080/realms/ecomm-app/protocol/openid-connect/userinfo}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
        registration:
          keycloak:
            client-id: ecomm-oauth2
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
    instances:
      userCircuit:
        baseConfig: default
      orderCircuit:
        baseConfig: default
      productCircuit:
        baseConfig: default
      inventoryCircuit:
        baseConfig: default
      paymentCircuit:
        baseConfig: default
      cartCircuit:
        baseConfig: default
      addressCircuit:
        baseConfig: default

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty.http.client: DEBUG
